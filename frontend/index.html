<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TASKORA – Collaborative Project Management Tool</title>
  <meta name="description" content="Plan Together. Work Smarter. Deliver Better. Real-time collaborative project management with Kanban boards, task assignment, and live comments.">
  
  <!-- Favicon / Icon -->
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

  <!-- Stylesheets -->
  <link rel="stylesheet" href="css/theme.css">
  <link rel="stylesheet" href="css/layout.css">
  <link rel="stylesheet" href="css/components.css">
  <link rel="stylesheet" href="css/auth.css">
  <link rel="stylesheet" href="css/kanban.css">
  <link rel="stylesheet" href="css/task-modal.css">
  <link rel="stylesheet" href="css/pages.css">

  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>

  <!-- ==============================================================================
       AUTH CONTAINER (Login / Register / Forgot Password)
       ============================================================================== -->
  <div id="auth-view" style="display: none;"></div>

  <!-- ==============================================================================
       AUTHENTICATED MAIN APP WORKSPACE
       ============================================================================== -->
  <div id="app-container" style="display: none;">
    <!-- Mobile Sidebar Backdrop Overlay -->
    <div id="sidebar-overlay" class="sidebar-overlay"></div>

    <!-- SIDEBAR -->
    <aside id="app-sidebar" class="sidebar">
      <div class="sidebar-header">
        <a href="#/dashboard" class="brand">
          <div class="brand-icon">
            <i data-lucide="layers" style="width: 20px; height: 20px;"></i>
          </div>
          <span class="brand-name">TASKORA</span>
          <span class="brand-badge">PRO</span>
        </a>
      </div>
      <div class="sidebar-tagline">Plan Together. Work Smarter. Deliver Better.</div>

      <!-- Navigation Links -->
      <nav class="sidebar-nav">
        <div class="nav-section-title">Workspace</div>
        <a href="#/dashboard" class="nav-item" data-route="dashboard">
          <i data-lucide="layout-dashboard"></i>
          <span>Dashboard</span>
        </a>
        <a href="#/projects" class="nav-item" data-route="projects">
          <i data-lucide="folder-kanban"></i>
          <span>My Projects</span>
        </a>
        <a href="#/projects/new" class="nav-item" data-route="projects/new">
          <i data-lucide="folder-plus"></i>
          <span>Create Project</span>
        </a>

        <div class="nav-section-title">Communication</div>
        <a href="#/notifications" class="nav-item" data-route="notifications">
          <i data-lucide="bell"></i>
          <span>Notifications</span>
          <span id="sidebar-unread-badge" class="nav-badge" style="display: none;">0</span>
        </a>

        <div class="nav-section-title">Account</div>
        <a href="#/profile" class="nav-item" data-route="profile">
          <i data-lucide="user"></i>
          <span>User Profile</span>
        </a>
        <a href="#/settings" class="nav-item" data-route="settings">
          <i data-lucide="settings"></i>
          <span>Settings</span>
        </a>
      </nav>

      <!-- Sidebar Footer with Real-Time Pill & User Profile -->
      <div class="sidebar-footer">
        <a href="#/profile" class="user-quick-profile">
          <div class="user-quick-avatar" id="sidebar-user-avatar">U</div>
          <div class="user-quick-meta">
            <span class="user-quick-name" id="sidebar-user-name">User</span>
            <span class="user-quick-role" id="sidebar-user-role">Member</span>
          </div>
        </a>
        <div id="connection-status-pill" class="connection-pill" title="Real-time live collaboration connected">
          <span class="status-dot"></span>
          <span id="connection-status-text">Live</span>
        </div>
      </div>
    </aside>

    <!-- MAIN WRAPPER -->
    <div class="main-wrapper">
      <!-- TOP NAVBAR -->
      <header class="top-navbar">
        <div class="navbar-left">
          <button id="mobile-sidebar-toggle" class="mobile-menu-btn" aria-label="Toggle navigation menu">
            <i data-lucide="menu"></i>
          </button>
          <div class="page-title-group">
            <h1 class="page-title" id="page-heading">Dashboard</h1>
            <div class="page-breadcrumb" id="page-breadcrumb">TASKORA &rsaquo; Overview</div>
          </div>
        </div>

        <div class="navbar-right">
          <!-- Quick "+ New Task" button (visible on Kanban & Project views) -->
          <button id="btn-quick-new-task" class="btn btn-primary btn-sm" style="display: none;">
            <i data-lucide="plus"></i>
            <span>New Task</span>
          </button>

          <!-- Notification Bell Icon -->
          <a href="#/notifications" class="icon-btn" aria-label="View notifications">
            <i data-lucide="bell"></i>
            <span id="top-unread-badge" class="badge-counter" style="display: none;">0</span>
          </a>

          <!-- Logout Button -->
          <button id="btn-logout" class="icon-btn" title="Sign out of Taskora" aria-label="Logout">
            <i data-lucide="log-out"></i>
          </button>
        </div>
      </header>

      <!-- MAIN DYNAMIC CONTENT CONTAINER -->
      <main id="main-view" role="main"></main>
    </div>
  </div>

  <!-- ==============================================================================
       MODALS CONTAINER
       ============================================================================== -->
  <div id="modal-container"></div>

  <!-- ==============================================================================
       TOAST NOTIFICATIONS CONTAINER
       ============================================================================== -->
  <div id="toast-container" class="toast-container" aria-live="polite"></div>

  <!-- Socket.IO Client Library -->
  <script src="/socket.io/socket.io.js"></script>

  <!-- Frontend Modules -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
